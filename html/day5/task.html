<!-- two side by side banners, where first banner writes breaking news, and its design will be red background color and color is white, and beside that breaking news banner, in that adjacent banner we have to write any news or content which background color is blue and color is white  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .main{
            display: flex;
            align-items: flex-end;
        }
      #d1{
         border: 3px solid;
         height: 30px;
         width: 150px;
         background-color: red;
         color: aliceblue;
      }
      #d2{
         border: 3px solid;
         height: 30px;
         width: 1000px;
         background-color: blue;
         color: aliceblue;
      }
    </style>
 </head>
 <body>
   <br><br><br><br><br>
   <div class="main">   
      <p id="d1">
         <b>
            <big>
               <strong>
                  Breaking News
               </strong>
            </big>
         </b>
      </p>
      <p id="d2">
         <marquee>
            <big>
               <strong>
                  India launches new AI technology initiative | 
            Heavy rains expected in coastal areas tomorrow | 
            Stock markets reach record highs today | 
            Scientists discover new renewable energy method | 
            Cricket team wins thrilling final match
               </strong>
            </big>
         </marquee>
      </p>
   </div>
</body>
 </html>
