<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="">
        <table cellpadding="10">

            <tr>
                <td><label for="fn">FullName</label></td>
                <td>
                    <input type="text" id="fn">
                    (max 20 char a-z and A-Z)
                </td>
            </tr>

            <tr>
                <td><label for="ln">LastName</label></td>
                <td>
                    <input type="text" id="ln">
                    (max 20 char a-z and A-Z)
                </td>
            </tr>

            <tr>
                <td><label for="dob">Date of Birth</label></td>
                <td>
                    <input type="date" id="dob">
                </td>
            </tr>

            <tr>
                <td><label>GENDER</label></td>
                <td>
                    <input type="radio" name="gender" id="male">
                    <label for="male">male</label>

                    <input type="radio" name="gender" id="female">
                    <label for="female">female</label>
                </td>
            </tr>

            <tr>
                <td><label for="email">EMAIL ID</label></td>
                <td>
                    <input type="email" id="email">
                </td>
            </tr>

            <tr>
                <td><label for="mobile">Mobile No</label></td>
                <td>
                    <input type="text" id="mobile">
                </td>
            </tr>

            <tr>
                <td><label for="add">ADDRESS</label></td>
                <td>
                    <textarea id="add" rows="8" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td><label for="city">CITY</label></td>
                <td>
                    <input type="text" id="city">
                    (max 20 char a-z and A-Z)
                </td>
            </tr>

            <tr>
                <td><label for="pin">PIN CODE</label></td>
                <td>
                    <input type="text" id="pin">
                    (6 digit number)
                </td>
            </tr>

            <tr>
                <td><label for="state">STATE</label></td>
                <td>
                    <input type="text" id="state">
                </td>
            </tr>

            <tr>
                <td><label for="country">COUNTRY</label></td>
                <td>
                    <input type="text" id="country">
                </td>
            </tr>

            <tr>
                <td><label>HOBBIES</label></td>
                <td>
                    <input type="checkbox" id="drawing">
                    <label for="drawing">Drawing</label>

                    <input type="checkbox" id="singing">
                    <label for="singing">Singing</label>

                    <input type="checkbox" id="dancing">
                    <label for="dancing">Dancing</label>

                    <br>

                    <input type="checkbox" id="others">
                    <label for="others">Others</label>
                </td>
            </tr>

            <tr>
                <td>Qualification</td>
                <td>
                    <table cellpadding="5" cellspacing="0">

                        <tr>
                            <th>sl.no</th>
                            <th>Examination</th>
                            <th>Board</th>
                            <th>Percentage</th>
                            <th>Year of passing</th>
                        </tr>

                        <tr>
                            <td>01</td>
                            <td>Class X</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>

                        <tr>
                            <td>02</td>
                            <td>Class XII</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>

                        <tr>
                            <td>03</td>
                            <td>Graduation</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>

                        <tr>
                            <td>04</td>
                            <td>Master</td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                            <td><input type="text"></td>
                        </tr>

                    </table>
                </td>
            </tr>

            <tr>
                <td>COURSES APPLIED FOR</td>
                <td>
                    <input type="radio" name="course" id="bsc">
                    <label for="bsc">BSC</label>

                    <input type="radio" name="course" id="bcom">
                    <label for="bcom">B.com</label>

                    <input type="radio" name="course" id="bscs">
                    <label for="bscs">B.sc</label>

                    <input type="radio" name="course" id="ba">
                    <label for="ba">B.A</label>
                </td>
            </tr>

            <tr>
                <td>
                    <input type="submit" value="Submit">
                </td>
                <td>
                    <input type="reset" value="Reset">
                </td>
            </tr>

        </table>
    </form>

</body>
</html>
